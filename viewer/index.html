<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мой дом 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #e7ebe9;
      --surface: #ffffff;
      --surface-2: #f2f4f3;
      --ink: #1c2630;
      --muted: #5b6870;
      --line: #d2d9d6;
      --accent: #c2410c;
      --accent-ink: #ffffff;
      --window: #1f6fb5;
      --door: #8a5a2b;
      --wall: #1c2630;
      --partition: #56626b;
      --grid: #e4e9e7;
      --axis: #a3afb6;
      --slab: #f7f5f0;
      --h22: #d08a2a;
      --danger: #b42318;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      --panel-w: 460px;
      --sheet-h: 66%;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #12181b;
        --surface: #1b2327;
        --surface-2: #222c31;
        --ink: #e3e8ea;
        --muted: #97a4ab;
        --line: #33424a;
        --accent: #f0773a;
        --accent-ink: #1b1109;
        --window: #62aeef;
        --door: #c99463;
        --wall: #dfe5e8;
        --partition: #a7b3ba;
        --grid: #232d32;
        --axis: #52626a;
        --slab: #1f282c;
        --h22: #e0a24f;
        --danger: #f97066;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #12181b;
      --surface: #1b2327;
      --surface-2: #222c31;
      --ink: #e3e8ea;
      --muted: #97a4ab;
      --line: #33424a;
      --accent: #f0773a;
      --accent-ink: #1b1109;
      --window: #62aeef;
      --door: #c99463;
      --wall: #dfe5e8;
      --partition: #a7b3ba;
      --grid: #232d32;
      --axis: #52626a;
      --slab: #1f282c;
      --h22: #e0a24f;
      --danger: #f97066;
    }

    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button {
      border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
      padding: 5px 10px; cursor: pointer; min-height: 32px;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button:disabled { opacity: .45; cursor: default; }
    button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    body.editing #app { right: var(--panel-w); }

    #panel {
      position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px;
      max-width: min(360px, calc(100% - 24px));
      background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; z-index: 2;
    }
    #panel h1 { font-size: 15px; font-weight: 600; margin: 0; text-wrap: balance; }
    .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
    #edit { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
    #edit[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
    #error { color: var(--danger); white-space: pre-wrap; }
    #variants:empty { display: none; }
    #variants select { max-width: 100%; }
    #error:empty { display: none; }
    .label {
      font: 12px var(--font); background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink);
      padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none;
    }

    /* ---------- прогулка ---------- */
    #walkbar, #joy, #fly-buttons { display: none; }
    body.walking #panel { display: none; }
    body.walking #walkbar {
      display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: center;
      position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
      width: max-content; max-width: calc(100% - 24px); z-index: 2;
      background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px;
    }
    .walk-hint { color: var(--muted); font-size: 12px; }
    .walk-hint-touch { display: none; }
    body.walking #joy {
      position: absolute; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 2;
      width: 120px; height: 120px; border-radius: 50%; touch-action: none;
      background: color-mix(in srgb, var(--surface) 45%, transparent); border: 2px solid color-mix(in srgb, var(--ink) 35%, transparent);
    }
    #joy span {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
      background: color-mix(in srgb, var(--surface) 90%, transparent); border: 2px solid var(--accent); pointer-events: none;
    }
    body.walking:has(#noclip:checked) #fly-buttons {
      display: grid; gap: 8px; position: absolute; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 2;
    }
    #fly-buttons button { width: 56px; height: 56px; border-radius: 50%; font-size: 18px; touch-action: none; }
    @media (hover: hover) and (pointer: fine) {
      body.walking #joy { display: none; }
      body.walking:has(#noclip:checked) #fly-buttons { display: none; }
    }
    @media (pointer: coarse) {
      .walk-hint-keys { display: none; }
      .walk-hint-touch { display: inline; }
    }

    /* ---------- фото ---------- */
    #photobar { display: none; }
    body.photo #panel, body.photo #labels-layer { visibility: hidden; }
    body.photo #photobar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
      width: max-content; max-width: calc(100% - 24px); z-index: 2;
      background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px;
    }
    #photo-status { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ---------- экскурсия ---------- */
    #tourbar { display: none; }
    body.touring #panel { display: none; }
    body.touring #tourbar { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    #stop-tour {
      position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; pointer-events: auto;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
    }
    #tour-caption {
      position: absolute; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px);
      font: 600 clamp(20px, 3.4vw, 34px)/1.15 var(--font); letter-spacing: .01em; color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35);
      opacity: 0; transition: opacity .8s ease, transform .8s ease; white-space: nowrap;
    }
    #tour-caption.show { opacity: 1; transform: translate(-50%, 0); }
    #tour-track {
      position: absolute; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden;
    }
    #tour-progress { height: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }

    /* ---------- редактор ---------- */
    #editor {
      position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w);
      background: var(--surface); border-left: 1px solid var(--line);
      display: none; grid-template-rows: auto minmax(200px, 1fr) auto auto; z-index: 3;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body.editing #editor { display: grid; }
    .ed-head { padding: 10px 12px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
    .ed-row { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .ed-seg, .ed-actions { display: flex; gap: 4px; }
    .ed-tools { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .ed-tools::-webkit-scrollbar { display: none; }
    .ed-tools button { flex: 1 0 auto; }
    .ed-tools button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .ed-close { min-width: 32px; }
    .ed-canvas { position: relative; min-height: 0; background: var(--surface-2); }
    #ed-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
    .ed-props { padding: 10px 12px; border-top: 1px solid var(--line); min-height: 64px; max-height: 34vh; overflow-y: auto; overscroll-behavior: contain; }
    .ed-hint { margin: 0; color: var(--muted); max-width: 60ch; }
    .ed-props-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .ed-field { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
    .ed-field input, .ed-field select {
      font: 14px var(--mono); color: var(--ink); background: var(--surface-2);
      border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0;
    }
    .ed-field input[type="text"] { font-family: var(--font); }
    .ed-field input[type="color"] { padding: 2px; height: 34px; }
    .ed-slider { grid-column: 1 / -1; }
    .ed-sky-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
    .ed-slider-row { display: flex; gap: 8px; align-items: center; }
    .ed-slider-row input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); height: 28px; }
    .ed-slider-row input[type="number"] { width: 5.5em; flex: none; }
    .ed-readout { grid-column: 1 / -1; margin: 0; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
    .ed-danger { color: var(--danger); }
    .ed-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); }
    .ed-status { flex: 1 1 140px; color: var(--muted); font-size: 12px; }

    /* элементы плана */
    .g-grid { stroke: var(--grid); stroke-width: 1px; vector-effect: non-scaling-stroke; fill: none; }
    .g-axis { stroke: var(--axis); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 12 4 2 4; }
    .g-axis-label { fill: var(--muted); font-family: var(--mono); text-anchor: middle; }
    .g-slab { fill: var(--slab); stroke: none; }
    .g-room { opacity: .45; }
    .g-hole { fill: var(--surface-2); stroke: var(--axis); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 4 3; }
    .g-stair { fill: color-mix(in srgb, var(--door) 22%, var(--surface)); stroke: var(--door); }
    .g-stair-up { opacity: .45; }
    .g-h22 { stroke: var(--h22); stroke-width: 1.2px; vector-effect: non-scaling-stroke; stroke-dasharray: 6 5; }
    .g-h22-label { fill: var(--h22); font-family: var(--mono); text-anchor: end; }
    .g-wall { stroke: var(--partition); }
    .g-ext { stroke: var(--wall); }
    .g-glass { stroke: var(--window); opacity: .6; }
    .g-virtual { stroke: var(--muted); stroke-dasharray: .15 .1; }
    .g-gap { stroke: var(--surface-2); }
    .g-op { stroke-linecap: butt; }
    .g-window, .g-glassdoor { stroke: var(--window); }
    .g-door { stroke: var(--door); }
    .g-swing { fill: none; stroke: var(--door); opacity: .7; }
    .g-sky { fill: color-mix(in srgb, var(--window) 12%, transparent); stroke: var(--window); stroke-dasharray: .12 .08; }
    .g-room-name { fill: var(--ink); text-anchor: middle; font-family: var(--font); font-weight: 500; }
    .g-room-area { fill: var(--muted); text-anchor: middle; font-family: var(--mono); }
    .g-bound { fill: color-mix(in srgb, #6f9a4e 14%, transparent); stroke: #5b4636; stroke-linejoin: round; }
    .g-path { fill: color-mix(in srgb, var(--muted) 22%, transparent); stroke: none; }
    .g-bld { fill: color-mix(in srgb, #c9a27a 45%, var(--surface)); stroke: var(--wall); }
    .g-gate { stroke: #2f3337; stroke-linecap: butt; }
    .g-gate-gap { stroke-dasharray: .2 .15; opacity: .6; }
    .ed-btnrow { display: flex; gap: 6px; align-items: end; }
    .ed-btnrow { flex-wrap: wrap; grid-column: 1 / -1; }
    .g-area { stroke: color-mix(in srgb, var(--ink) 25%, transparent); stroke-width: 1px; vector-effect: non-scaling-stroke; opacity: .75; }
    .g-item { stroke: color-mix(in srgb, var(--ink) 45%, transparent); }
    .g-plant { opacity: .7; }
    .ed-palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ed-palette button { display: inline-flex; align-items: center; gap: 6px; }
    .ed-palette button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .ed-pal-select { max-width: 320px; margin-top: 8px; }
    .g-furn { stroke: color-mix(in srgb, var(--ink) 55%, transparent); opacity: .85; }
    .g-furn-front { stroke: var(--ink); opacity: .6; }
    .ed-palette i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .g-sel { stroke: var(--accent); opacity: .45; stroke-linecap: round; }
    .g-sel-rect { fill: none; stroke: var(--accent); }
    .g-handle { fill: var(--surface); stroke: var(--accent); }
    .g-draft { stroke: var(--accent); stroke-linecap: round; opacity: .85; }
    .g-dim { fill: var(--accent); font-family: var(--mono); text-anchor: middle; font-weight: 500; }

    @media (max-width: 860px) {
      body.editing #app { right: 0; bottom: var(--sheet-h); }
      #editor { top: auto; left: 0; width: auto; height: var(--sheet-h); border-left: 0; border-top: 1px solid var(--line); padding-top: 0; }
      body.editing #panel { display: none; }
      .ed-head { padding: 8px 10px 6px; gap: 6px; }
      #editor button { padding: 4px 8px; min-height: 30px; font-size: 13px; }
      .ed-props { padding: 8px 10px; min-height: 0; }
      .ed-props-head { margin-bottom: 6px; }
      .ed-hint { font-size: 12px; }
      .ed-foot { padding: 6px 10px; gap: 4px; }
      .ed-field input, .ed-field select { padding: 3px 6px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js",
      "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="panel">
      <h1 id="title">Загрузка…</h1>
      <div class="row">
        <label><input type="checkbox" id="roof" checked> Крыша</label>
        <label><input type="checkbox" id="labels" checked> Подписи</label>
        <label>Этажи: <select id="floors"></select></label>
      </div>
      <div class="row" id="variants"></div>
      <div class="row"><label>Качество: <select id="quality"><option value="high">Высокое</option><option value="fast">Быстрое</option></select></label></div>
      <div class="row">
        <button type="button" id="top">Вид сверху</button>
        <button type="button" id="reset">3D вид</button>
        <button type="button" id="photo" title="Фотореалистичный кадр с текущего ракурса">Фото</button>
        <button type="button" id="tour">Экскурсия</button>
        <button type="button" id="walk">Прогулка</button>
        <button type="button" id="edit" aria-pressed="false">Редактировать план</button>
      </div>
      <div id="error"></div>
    </div>
    <div id="walkbar" role="toolbar" aria-label="Прогулка">
      <label><input type="checkbox" id="noclip"> Сквозь стены (полёт)</label>
      <span class="walk-hint walk-hint-keys">WASD — идти · тянуть мышью — смотреть · E — открыть/закрыть дверь · Shift — быстрее · Space / C — вверх / вниз в полёте · Esc — выход</span>
      <button type="button" id="door-toggle">Дверь</button>
      <span class="walk-hint walk-hint-touch">Джойстик — идти · свайп по экрану — смотреть</span>
      <button type="button" id="exit-walk">Выйти</button>
    </div>
    <div id="photobar" role="status">
      <span id="photo-status"></span>
      <button type="button" id="photo-save">Сохранить картинку</button>
      <button type="button" id="photo-close">Закрыть</button>
    </div>
    <div id="tourbar">
      <button type="button" id="stop-tour">Остановить экскурсию</button>
      <div id="tour-caption" aria-live="polite"></div>
      <div id="tour-track"><div id="tour-progress"></div></div>
    </div>
    <div id="joy" aria-label="Джойстик движения"><span></span></div>
    <div id="fly-buttons">
      <button type="button" id="fly-up" aria-label="Вверх">▲</button>
      <button type="button" id="fly-down" aria-label="Вниз">▼</button>
    </div>
  </div>
  <div id="editor"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
